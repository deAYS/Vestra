# Unsigned local/release artifacts. Building never publishes a release.
appId: dev.vestra.manager
productName: Vestra
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
extraResources:
  - from: ../../packages/core/dist/vestra.js
    to: payload/vestra.js
npmRebuild: false
asar: true
win:
  icon: ../../assets/vestra-logo/app-icon.ico
  signExecutable: false
  artifactName: Vestra-${version}-${arch}-Setup.${ext}
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Vestra
portable:
  artifactName: Vestra-${version}-${arch}-Portable.${ext}
