name: Verify Vestra
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: bun run site:build
      - run: bun run test:electron
      - run: bun run manager:package
      - run: npm pack ./packages/api
      - uses: actions/upload-artifact@v4
        with:
          name: vestra-windows-and-sdk
          path: |
            apps/manager/release/*.exe
            packages/api/dist/
            vestra-api-*.tgz
          if-no-files-found: error
